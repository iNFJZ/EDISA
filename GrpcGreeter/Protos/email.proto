syntax = "proto3";

option csharp_namespace = "GrpcGreeter";

package email;

service EmailService {
  rpc GetTemplateById (GetTemplateByIdRequest) returns (GetTemplateByIdResponse);
  rpc GetTemplateByNameAndLanguage (GetTemplateByNameAndLanguageRequest) returns (GetTemplateByNameAndLanguageResponse);
  rpc GetTemplatesByLanguage (GetTemplatesByLanguageRequest) returns (GetTemplatesByLanguageResponse);
  rpc GetAllTemplates (GetAllTemplatesRequest) returns (GetAllTemplatesResponse);
  rpc CreateTemplate (CreateTemplateRequest) returns (CreateTemplateResponse);
  rpc UpdateTemplate (UpdateTemplateRequest) returns (UpdateTemplateResponse);
  rpc DeleteTemplate (DeleteTemplateRequest) returns (DeleteTemplateResponse);
  rpc RestoreTemplate (RestoreTemplateRequest) returns (RestoreTemplateResponse);
  rpc GenerateVerifyEmailContent (GenerateVerifyEmailContentRequest) returns (GenerateVerifyEmailContentResponse);
  rpc GenerateResetPasswordContent (GenerateResetPasswordContentRequest) returns (GenerateResetPasswordContentResponse);
  rpc GenerateDeactivateAccountContent (GenerateDeactivateAccountContentRequest) returns (GenerateDeactivateAccountContentResponse);
  rpc GenerateRegisterGoogleContent (GenerateRegisterGoogleContentRequest) returns (GenerateRegisterGoogleContentResponse);
  rpc GenerateRestoreAccountContent (GenerateRestoreAccountContentRequest) returns (GenerateRestoreAccountContentResponse);
  rpc GetSubject (GetSubjectRequest) returns (GetSubjectResponse);
}

message GetTemplateByIdRequest {
  int32 id = 1;
}

message GetTemplateByIdResponse {
  bool success = 1;
  string message = 2;
  EmailTemplateInfo template = 3;
}

message GetTemplateByNameAndLanguageRequest {
  string name = 1;
  string language = 2;
}

message GetTemplateByNameAndLanguageResponse {
  bool success = 1;
  string message = 2;
  EmailTemplateInfo template = 3;
}

message GetTemplatesByLanguageRequest {
  string language = 1;
}

message GetTemplatesByLanguageResponse {
  bool success = 1;
  string message = 2;
  repeated EmailTemplateInfo templates = 3;
}

message GetAllTemplatesRequest {
}

message GetAllTemplatesResponse {
  bool success = 1;
  string message = 2;
  repeated EmailTemplateInfo templates = 3;
}

message CreateTemplateRequest {
  string name = 1;
  string language = 2;
  string subject = 3;
  string body = 4;
  string description = 5;
  bool is_active = 6;
  string created_by = 7;
}

message CreateTemplateResponse {
  bool success = 1;
  string message = 2;
  EmailTemplateInfo template = 3;
}

message UpdateTemplateRequest {
  int32 id = 1;
  string name = 2;
  string language = 3;
  string subject = 4;
  string body = 5;
  string description = 6;
  bool is_active = 7;
  string updated_by = 8;
}

message UpdateTemplateResponse {
  bool success = 1;
  string message = 2;
  EmailTemplateInfo template = 3;
}

message DeleteTemplateRequest {
  int32 id = 1;
}

message DeleteTemplateResponse {
  bool success = 1;
  string message = 2;
}

message RestoreTemplateRequest {
  int32 id = 1;
}

message RestoreTemplateResponse {
  bool success = 1;
  string message = 2;
}

message GenerateVerifyEmailContentRequest {
  string username = 1;
  string verify_link = 2;
  string lang = 3;
}

message GenerateVerifyEmailContentResponse {
  bool success = 1;
  string message = 2;
  string content = 3;
}

message GenerateResetPasswordContentRequest {
  string username = 1;
  string email = 2;
  string user_id = 3;
  string ip_address = 4;
  string reset_link = 5;
  int32 expiry_minutes = 6;
  string lang = 7;
}

message GenerateResetPasswordContentResponse {
  bool success = 1;
  string message = 2;
  string content = 3;
}

message GenerateDeactivateAccountContentRequest {
  string username = 1;
  string lang = 2;
}

message GenerateDeactivateAccountContentResponse {
  bool success = 1;
  string message = 2;
  string content = 3;
}

message GenerateRegisterGoogleContentRequest {
  string username = 1;
  string reset_link = 2;
  string lang = 3;
}

message GenerateRegisterGoogleContentResponse {
  bool success = 1;
  string message = 2;
  string content = 3;
}

message GenerateRestoreAccountContentRequest {
  string username = 1;
  string restored_at = 2;
  string reason = 3;
  string lang = 4;
}

message GenerateRestoreAccountContentResponse {
  bool success = 1;
  string message = 2;
  string content = 3;
}

message GetSubjectRequest {
  string type = 1;
  string lang = 2;
}

message GetSubjectResponse {
  bool success = 1;
  string message = 2;
  string subject = 3;
}

message EmailTemplateInfo {
  int32 id = 1;
  string name = 2;
  string language = 3;
  string subject = 4;
  string body = 5;
  string description = 6;
  bool is_active = 7;
  string created_at = 8;
  string updated_at = 9;
  string created_by = 10;
  string updated_by = 11;
  string deleted_at = 12;
} 