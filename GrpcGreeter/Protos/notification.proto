syntax = "proto3";

option csharp_namespace = "GrpcGreeter";

package notification;

service NotificationService {
  rpc CreateNotification (CreateNotificationRequest) returns (CreateNotificationResponse);
  rpc GetNotificationsByUser (GetNotificationsByUserRequest) returns (GetNotificationsByUserResponse);
  rpc MarkAsRead (MarkAsReadRequest) returns (MarkAsReadResponse);
  rpc DeleteNotification (DeleteNotificationRequest) returns (DeleteNotificationResponse);
}

message CreateNotificationRequest {
  string user_id = 1;
  string title = 2;
  string message = 3;
  string type = 4;
}

message CreateNotificationResponse {
  bool success = 1;
  string message = 2;
  NotificationInfo notification = 3;
}

message GetNotificationsByUserRequest {
  string user_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message GetNotificationsByUserResponse {
  bool success = 1;
  string message = 2;
  repeated NotificationInfo notifications = 3;
  int32 total_count = 4;
  int32 page = 5;
  int32 page_size = 6;
}

message MarkAsReadRequest {
  string notification_id = 1;
}

message MarkAsReadResponse {
  bool success = 1;
  string message = 2;
  NotificationInfo notification = 3;
}

message DeleteNotificationRequest {
  string notification_id = 1;
}

message DeleteNotificationResponse {
  bool success = 1;
  string message = 2;
}

message NotificationInfo {
  string id = 1;
  string user_id = 2;
  string title = 3;
  string message = 4;
  string type = 5;
  bool is_read = 6;
  string created_at = 7;
}
